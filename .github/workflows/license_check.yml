name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    with:
      # The gate catches unexpected third-party copyleft (GPL/AGPL/LGPL) so
      # this Apache-2.0 "universal donor" package stays permissively licensed;
      # exclude the project's own first-party packages from that scan.
      exclude_packages: '^(hivemind|hivescope|z85base91|poorman).*'
