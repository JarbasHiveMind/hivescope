[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivescope"
dynamic = ["version"]
description = "Hivescope: E2E testing library for HiveMind protocol"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["hivemind", "protocol", "testing", "e2e", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"
dependencies = [
    "hivemind-bus-client>=0.9.2a1",
    # 2.x prerelease floors: a stable >=4.0 / >=0.7 floor resolves to hivemind-core
    # 4.0.0 + old ovos-bus-client under a plain `pip install`, forcing every
    # hivescope consumer to floor the whole 2.x stack themselves. Flooring the 2.x
    # line here (incl. ovos-bus-client, whose 2.x is prerelease-only — a direct
    # prerelease specifier is needed to enable it) lets consumers get the right
    # stack from just `hivescope>=0.5.1a1`.
    "hivemind-core>=4.6.2a1,<6.0.0",
    "ovos-bus-client>=2.0.0a3,<3.0.0",
    "ovos-utils>=0.0.40",
    "pytest>=7.4",
    "websockets>=11",
    # DROPPABLE once hivemind-websocket-protocol releases with its dev-branch
    # unpinned pyOpenSSL: the released wheel pins pyopenssl==22.0.0, whose
    # loose floor lets cryptography float to >=42 where the bindings that
    # pyOpenSSL 22 needs (e.g. GEN_EMAIL) no longer exist.
    "cryptography<51",
]

[project.optional-dependencies]
ovos = [
    "ovoscope>=0.13",
    "ovos-core>=0.0.30",
]
plot = [
    "matplotlib",
    "networkx",
]
# The `timeout` key below is a pytest-timeout key. Without this extra installed
# pytest does NOT fail on it: it emits `PytestConfigWarning: Unknown config
# option: timeout` and carries on, so the cap is absent while the run looks
# normal. The warning is easy to miss in a long log, which is why `--strict-config`
# is in addopts below — that turns the warning into an error and makes this
# extra's absence impossible to overlook rather than merely reported.
test = [
    "pytest-timeout>=2.1",
]

[tool.pytest.ini_options]
# `--strict-config` turns an unknown ini key from a warning into an error, so a
# run without the `test` extra FAILS instead of quietly losing the cap below.
# That is the point of this line: the defect this file was changed to fix was a
# precondition that could be forgotten, and a cure that can itself be forgotten
# keeps the mechanism. It guards every future config key here, not only `timeout`.
addopts = "--strict-config"
# Needs the `test` extra: see the note there. The cap catches a deadlock, so it
# is close to the cost of the slowest cell. A cell that needs more says so with
# its own `@pytest.mark.timeout`.
timeout = 30
markers = [
    "slow: slow tests that may take longer",
]

[tool.setuptools.dynamic]
version = {attr = "hivescope.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["hivescope*"]

[project.entry-points.pytest11]
hivescope_xdg_isolation = "hivescope.xdg_isolation"
